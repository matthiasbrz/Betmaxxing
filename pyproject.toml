[project]
name = "betmaxxing"
version = "0.2.0"
description = "Betmaxxing — decision-support engine for pre-match sports betting value analysis (personal use)."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[project.scripts]
betmaxxing = "betmaxxing.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Later entries win. "error" first means any warning not explicitly listed
# below fails the suite, so a new deprecation cannot quietly accumulate. CI runs
# plain `pytest`: passing -W on the command line would override these and defeat
# the point.
filterwarnings = [
    "error",
    # Starlette's TestClient announces that it uses httpx rather than httpx2.
    # It concerns Starlette's own internals, not our usage, and the pinned
    # FastAPI/Starlette pair has no supported alternative. Matched by message so
    # only this exact warning is silenced.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
# Lints the whole repository, migrations included. Nothing is excluded to make
# a number go green: `alembic/versions` is generated code that still ships.
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["betmaxxing"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
