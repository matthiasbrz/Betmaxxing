[project]
name = "betmaxxing"
version = "0.2.0"
description = "Betmaxxing — decision-support engine for pre-match sports betting value analysis (personal use)."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
    # Starlette >= 1.3 uses httpx2 for its TestClient and emits a
    # StarletteDeprecationWarning when it has to fall back to httpx 0.x.
    # Installing httpx2 removes the warning at its source rather than filtering
    # it. The application itself still calls providers with `httpx`; the two
    # packages have distinct import names and coexist.
    "httpx2>=2.0",
]

[project.scripts]
betmaxxing = "betmaxxing.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Makes `tests/helpers.py` importable as `helpers` under BOTH `pytest` (the
# console script) and `python -m pytest`. Without it the two invocations resolve
# imports differently and CI silently runs a different suite. Declared here
# rather than assumed from the caller's working directory.
pythonpath = ["tests"]
markers = [
    "slow: spawns a subprocess or otherwise takes seconds rather than milliseconds",
]
# "error" makes any warning fail the suite, so a new deprecation cannot quietly
# accumulate. There is deliberately no entry after it: a filter that hides a
# warning we could fix is not a resolution.
filterwarnings = ["error"]

[tool.ruff]
# Lints the whole repository, migrations included. Nothing is excluded to make
# a number go green: `alembic/versions` is generated code that still ships.
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["betmaxxing"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
