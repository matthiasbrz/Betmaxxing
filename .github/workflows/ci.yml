name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs in demo mode: deterministic, keyless, and no network calls to
  # any provider. A CI run must never depend on a bookmaker being reachable, and
  # must never consume a provider credit. The opt-in smoke test
  # (scripts/smoke_the_odds_api.py) is deliberately not invoked here.
  BETMAXXING_MODE: demo
  BETMAXXING_NOTIFICATIONS_ENABLED: "false"
  BETMAXXING_CHALLENGE_ENABLED: "false"

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      # A real PostgreSQL, holding nothing but test rows. Concurrency claims that
      # only hold on SQLite are not concurrency claims: SQLite serialises every
      # writer behind one database-level lock, so `SELECT SUM(...)` then `INSERT`
      # looks atomic there and is not under READ COMMITTED. The suite skips
      # loudly when the URL is unset, and the guard below fails the build if it is.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: betmaxxing
          POSTGRES_PASSWORD: betmaxxing
          POSTGRES_DB: betmaxxing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U betmaxxing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BETMAXXING_TEST_POSTGRES_URL: postgresql+psycopg://betmaxxing:betmaxxing@localhost:5432/betmaxxing_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (pinned resolution)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]" -c constraints.txt

      - name: The PostgreSQL suite is not silently skipped
        run: |
          # A skipped concurrency suite is indistinguishable from a passing one in
          # the summary, so the presence of the URL is asserted, not assumed.
          test -n "$BETMAXXING_TEST_POSTGRES_URL"
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["BETMAXXING_TEST_POSTGRES_URL"])
          with engine.connect() as connection:
              print("PostgreSQL:", connection.execute(text("SHOW server_version")).scalar_one())
          PY

      - name: Lint (whole repository, migrations included)
        run: ruff check .

      - name: Format check (whole repository)
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests (console script, warnings fatal, SQLite + PostgreSQL)
        # The console script, not `python -m pytest`: the two resolve imports
        # differently and a suite that only collects under one of them is not a
        # suite. `-W error` is redundant with pyproject's `filterwarnings =
        # ["error"]` and passed anyway, so this step still fails on a warning
        # even if someone loosens the ini file.
        run: pytest -W error --cov=betmaxxing --cov-report=term-missing

      - name: The PostgreSQL concurrency suite actually ran
        # `-m postgres` with `--strict-markers`: if every one of these skipped,
        # nothing proved the claims the documentation makes about PostgreSQL.
        #
        # This guard could not see what it was looking for, in two ways. Both
        # only became visible once the step above stopped failing, because until
        # then this step was skipped rather than run:
        #
        #   * `-q` suppresses the summary counts. The captured log was a single
        #     line of progress dots, so `grep "[0-9]+ passed"` never matched and
        #     the step failed even with all 24 tests passing;
        #   * `^[0-9]+ skipped` is anchored, but pytest writes
        #     `24 skipped, 1431 deselected in …`. It matched neither a passing nor
        #     a skipped run, so the guard could never detect a skipped suite —
        #     the one thing it exists to detect.
        #
        # `pipefail` is new: `tee` returns 0, so pytest's own exit code used to be
        # swallowed and only the greps spoke. tests/test_ci_workflow.py pins all
        # three properties so they cannot regress quietly.
        run: |
          set -o pipefail
          pytest -W error -m postgres -rs | tee /tmp/pg.log
          if grep -qE "[0-9]+ skipped" /tmp/pg.log; then
            echo "::error::the PostgreSQL suite was skipped — the cluster was unreachable"
            exit 1
          fi
          grep -qE "[0-9]+ passed" /tmp/pg.log

      - name: The two pytest invocations collect the same suite
        # `--collect-only -q` ends with a blank line, so `tail -1` returned the
        # empty string for both invocations and this compared nothing to nothing:
        # it could not fail. Summing the per-module counts yields a number, and
        # asserting it is non-zero means an empty collection is a failure too.
        run: |
          set -o pipefail
          count() { "$@" --collect-only -q | awk -F': ' '/: [0-9]+$/ {s+=$2} END {print s+0}'; }
          script_count=$(count pytest)
          module_count=$(count python -m pytest)
          echo "pytest:           $script_count"
          echo "python -m pytest: $module_count"
          test "$script_count" -gt 0
          test "$script_count" = "$module_count"

      - name: python -m pytest also passes with warnings fatal
        run: python -m pytest -W error -q

      - name: No warning filter hides the Starlette/httpx deprecation
        run: |
          if grep -n "starlette.testclient" pyproject.toml; then
            echo "::error::the Starlette/httpx warning must be resolved, not filtered"
            exit 1
          fi
          echo "ok — no Starlette/httpx filter"

      - name: Migrations apply to a fresh database
        env:
          BETMAXXING_DATABASE_URL: sqlite+pysqlite:///./ci-fresh.db
        run: alembic upgrade head

      - name: Migrations apply from the reference schema
        env:
          BETMAXXING_DATABASE_URL: sqlite+pysqlite:///./ci-upgrade.db
        run: |
          alembic upgrade 65c32b5e3f63
          alembic upgrade head

      - name: Migrations apply to a fresh PostgreSQL
        env:
          BETMAXXING_DATABASE_URL: postgresql+psycopg://betmaxxing:betmaxxing@localhost:5432/betmaxxing_migrations
        run: |
          PGPASSWORD=betmaxxing createdb -h localhost -U betmaxxing betmaxxing_migrations
          alembic upgrade head
          alembic check

      - name: Migrations apply from the previous tranche's schema
        env:
          BETMAXXING_DATABASE_URL: sqlite+pysqlite:///./ci-tranche.db
        run: |
          alembic upgrade 3ce123580afa
          alembic upgrade head

      - name: No schema drift between models and migrations
        env:
          BETMAXXING_DATABASE_URL: sqlite+pysqlite:///./ci-fresh.db
        run: alembic check

      - name: Demo scan runs end to end
        run: betmaxxing scan --json > /dev/null

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package (the guard ships with it)
        run: pip install -e . -c constraints.txt

      - name: No committed .env file
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          echo "ok — no .env tracked"

      - name: No populated secret variable in any tracked file
        # One implementation, shared with the pre-commit hook and the test suite:
        # src/betmaxxing/security/secret_hygiene.py. This replaces an inline grep
        # that looked only at .env.example, only in upper case, and only at the
        # very start of a line. The verdict names the variable and the line and
        # never echoes the value, so a caught secret is not copied into this log.
        run: python -m betmaxxing.security.secret_hygiene

      - name: No credential-shaped value anywhere in the history
        # A clean tip proves nothing about what stays reachable: a key emptied by
        # a later commit still lives in the blob its first commit points at. That
        # is exactly how a key survived here until the history was rewritten.
        # `fetch-depth: 0` above is what makes this step possible.
        run: |
          python - <<'PY'
          import subprocess
          import sys

          from betmaxxing.security import secret_hygiene


          def git(*args: str) -> bytes:
              return subprocess.run(["git", *args], capture_output=True, check=True).stdout


          kinds = git("cat-file", "--batch-check", "--batch-all-objects").decode()
          blobs = [
              parts[0]
              for line in kinds.splitlines()
              if len(parts := line.split()) >= 2 and parts[1] == "blob"
          ]
          # A blob is content-addressed and carries no path, so every one is
          # judged by the rule that does not depend on the filename: a value
          # shaped like a real credential. Documentation placeholders stay legal.
          offenders = 0
          for sha in blobs:
              payload = git("cat-file", "blob", sha)
              upper = payload.upper()
              if b"BETMAXXING" not in upper and b"ANTHROPIC" not in upper:
                  continue
              text = payload.decode("utf-8", errors="replace")
              for finding in secret_hygiene.scan_text(text, path=f"blob {sha[:12]}"):
                  if finding.reason == secret_hygiene.LOOKS_LIKE_A_CREDENTIAL:
                      print(f"::error::{finding}")
                      offenders += 1
          print(f"scanned {len(blobs)} reachable blobs; credential-shaped values: {offenders}")
          sys.exit(1 if offenders else 0)
          PY

      - name: Scan for other vendors' secret patterns
        run: |
          # Complements the guard above, which knows only this project's own
          # variables. Deliberately narrow: real vendor key shapes, not every
          # long string.
          pattern='(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          if git grep -nEI "$pattern" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::possible secret committed"
            exit 1
          fi
          echo "ok — no secret pattern found"

      - name: The smoke test is never wired into CI
        run: |
          # It consumes real provider credits; it must stay opt-in and manual.
          # Only an actual invocation counts. The previous form matched any
          # mention of the script, including this workflow's own explanatory
          # comments, so the step could never pass and its red told nobody
          # anything. Comment lines are excluded and the match is anchored to a
          # command that would actually run the script.
          if grep -rnE '^[^#]*(python|bash|sh|\./)[^#]*smoke_the_odds_api' .github/workflows/; then
            echo "::error::the credit-consuming smoke test must not run in CI"
            exit 1
          fi
          echo "ok — smoke test not invoked by CI"
